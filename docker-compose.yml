services:
    backend:
        build:
            context: ./Back
            dockerfile: Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./Back:/var/www/html
        networks:
            - laravel_network
        depends_on:
            - mysql
        environment:
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=greenthumbs
            - DB_USERNAME=root
            - DB_PASSWORD=

    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./Back:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel_network
        depends_on:
            - backend

    mysql:
        image: mysql:8.0
        container_name: laravel_mysql
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: greenthumbs
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_ROOT_PASSWORD: ""
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laravel_network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: laravel_phpmyadmin
        restart: unless-stopped
        ports:
            - "8081:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: ""
        networks:
            - laravel_network
        depends_on:
            - mysql

    # Production React frontend
    frontend:
        build:
            context: ./Front
            dockerfile: Dockerfile
        container_name: react_frontend
        restart: unless-stopped
        ports:
            - "3000:80"
        networks:
            - laravel_network
        environment:
            - VITE_API_URL=http://localhost:8080/api

    # Development React frontend
    frontend-dev:
        build:
            context: ./Front
            dockerfile: Dockerfile.dev
        container_name: react_frontend_dev
        restart: unless-stopped
        working_dir: /app
        command: npm run dev -- --host 0.0.0.0
        volumes:
            - ./Front:/app
            - /app/node_modules
        ports:
            - "5173:5173"
        networks:
            - laravel_network
        environment:
            - NODE_ENV=development
            - VITE_API_URL=http://localhost:8080/api
            - CHOKIDAR_USEPOLLING=true

networks:
    laravel_network:
        driver: bridge

volumes:
    mysql_data:
        driver: local